# Test profile: in-memory H2 so the administration flow can be verified.
spring.datasource.url=jdbc:h2:mem:emrtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# The Sex enum has duplicate-by-case constants which H2 rejects as a native
# enum type; force varchar mapping for tests.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
